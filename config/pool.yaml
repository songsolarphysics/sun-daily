# Source pool for the nightly draw. The source panel writes this file; editing it by hand
# works too. weight sets how often something comes up; enabled: false (or weight: 0) takes
# it out of the draw.
sources:
  eui_hri: {enabled: true, weight: 3.00}
  aia_closeup: {enabled: true, weight: 3.00}
  aia_synoptic: {enabled: true, weight: 1.00}

# What aia_closeup draws: FL flares, FE filament eruptions, CJ coronal jets.
events:
  FL: 3
  FE: 2
  CJ: 2
