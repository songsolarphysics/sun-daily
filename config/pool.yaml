# Source pool for the nightly draw.
# weight sets how often a source comes up; enabled: false (or weight: 0) takes it out.
# This file is the single place the "pool" lives: edit it by hand, or let the source panel
# write it for you.
sources:
  aia_closeup:  {enabled: true, weight: 3}   # needs the JSOC_EMAIL secret
  eui_hri:      {enabled: true, weight: 3}
  aia_synoptic: {enabled: true, weight: 1}
